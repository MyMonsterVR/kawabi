version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2026.10
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4
    steps:
      - checkout
      - run:
          name: Compute dependency cache key
          command: |
            find . -path ./build -prune -o \( -name '*.gradle.kts' -o -name 'libs.versions.toml' -o -name 'gradle-wrapper.properties' \) -type f -print | sort | xargs cat > /tmp/gradle-cache-key
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "/tmp/gradle-cache-key" }}
            - gradle-v1-
      - run:
          name: Build debug APKs
          command: ./gradlew assembleDebug --stacktrace
      - save_cache:
          key: gradle-v1-{{ checksum "/tmp/gradle-cache-key" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
            - ~/android-sdk/platforms
            - ~/android-sdk/build-tools
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: kawabi-debug.apk

workflows:
  ci:
    jobs:
      - build
